  - {at: 2026-09-08T08:30:00Z, by: devingryu@korea.ac.kr, kind: note, body: "항목 5 완료(다운로드 승인 후) — stt.py(mlx-whisper large-v3, 언어 강제 안 함, WAV stdlib 디코드)+process.py(meta·pages→normalize→STT→transcript→mapping→notes, --debounce-seconds/--turbo/--skip-transcribe) 구현·CLI 배선. say 합성 한/영 클립으로 E2E 실검증: 디바운스 왕복 취소 정상, 전사 2세그먼트 타임스탬프 생성, page-001(영)/page-002(한) 노트 생성. 31 unittest 유지. 발견: Whisper가 클립당 1개 지배 언어만 감지해 세그먼트 lang 라벨이 부정확(영어 세그먼트도 lang=ko). 텍스트 내용 전사는 한/영 모두 정상. 세그먼트 단위 언어 라벨은 신뢰 불가 — design의 WhisperX(단어 단위) 후속 개선 근거. record/tag 미착수."}
